name: Auto Build & Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Astro Project
        run: npm run build

      - name: 📂 Siapkan File Deployment
        run: |
          mkdir -p deploy_payload
          cp -r dist deploy_payload/
          cp server.js deploy_payload/
          cp package.json deploy_payload/
          cp package-lock.json deploy_payload/
          mkdir -p deploy_payload/tmp
          touch deploy_payload/tmp/restart.txt

      - name: 🚀 Sync ke cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./deploy_payload/
          dangerous-clean-slate: false
